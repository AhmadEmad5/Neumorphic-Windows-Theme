; ==============================================================================
; ExplorerBlurMica - Neumorphic Dark Soft UI Configuration
; Provides hardware-accelerated Mica/Acrylic blur, soft tinting, and corner rounding
; ==============================================================================

[Main]
; Effect type: 0 = Default, 1 = Mica, 2 = Acrylic, 3 = Mica Alt (Tabbed)
Effect = 2

; Dark mode enforcement: 0 = Follow system, 1 = Light, 2 = Dark
Theme = 2

; Soft Neumorphic Canvas Tint Color (#18191C in ABGR hex: 0xEE1C1918)
BlendColor = 0xEE1C1918

; Acrylic Blur Radius (Higher value for ultra-soft physical dissipation)
BlurRadius = 30

; Window Corner Rounding: 0 = Default, 1 = Do not round, 2 = Round (16px), 3 = Small round (8px)
CornerPreference = 2

; Universal Window Border Color (Matte slate #1E2024 in ABGR hex: 0xFF24201E)
BorderColor = 0xFF24201E

; Custom Frame Margins (Left, Right, Top, Bottom)
CustomMargins = 0, 0, 32, 0

[Exclusions]
; Process names to exclude from blur injection
ExcludedProcesses = taskmgr.exe, mstsc.exe
